---
- name: Load distribution variables
  ansible.builtin.include_vars:
    file: "{{ 'arch.yaml' if ansible_facts['os_family'] == 'Archlinux' or ansible_facts['distribution'] == 'Archlinux' else 'fedora.yaml' }}"

- name: Install applications
  ansible.builtin.package:
    name: "{{ apps_packages }}"
    state: present

- name: Install application flatpaks
  community.general.flatpak:
    name: "{{ apps_flatpaks }}"
    state: present
    method: system
    remote: flathub
