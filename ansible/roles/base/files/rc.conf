hostname="citadel"
wlans_iwlwifi0="wlan0"
ifconfig_wlan0="WPA  DHCP"
ifconfig_wlan0_ipv6="inet6 accept_rtadv"
create_args_wlan0="country US regdomain FCC"
sshd_enable="YES"
ntpd_enable="YES"
ntpd_sync_on_start="YES"
powerd_enable="YES"
moused_nondefault_enable="NO"
# Set dumpdev to "AUTO" to enable crash dumps, "NO" to disable
dumpdev="AUTO"
zfs_enable="YES"
pcscd_enable="NO"
kld_list="i915kms cuse"
dbus_enable="YES"
seatd_enable="YES"
tailscaled_enable="YES"
devmatch_blocklist="if_iwm"
autofs_enable="YES"
webcamd_enable="YES"
linux_enable="YES"
jail_enable="YES"
hcsecd_enable="YES"
sndiod_enable="YES"
