---
- name: Load distribution variables
  ansible.builtin.include_vars:
    file: "{{ 'arch.yaml' if ansible_facts['os_family'] == 'Archlinux' or ansible_facts['distribution'] == 'Archlinux' else 'fedora.yaml' }}"

- name: Install base packages
  ansible.builtin.package:
    name: "{{ base_packages }}"
    state: present

- name: Enable nix daemon
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - nix-daemon.socket
    - nix-daemon.service
  when: ansible_facts['service_mgr'] == 'systemd'

- name: Enable flakes
  ansible.builtin.lineinfile:
    path: "{{ dotfiles_home }}/.config/nix/nix.conf"
    line: "experimental-features = nix-command flakes"
    create: true
    mode: "0644"
  become: false

- name: Add nix channel
  ansible.builtin.command:
    cmd: "nix-channel --add {{ nix_channel_url }} {{ nix_channel_name }}"
    creates: "{{ dotfiles_home }}/.nix-channels"
  become: false
  when: "'nix' in base_packages"

- name: Populate nix store
  ansible.builtin.command:
    cmd: nix-channel --update
    creates: /nix/store
  become: false
  when: "'nix' in base_packages"

- name: Install tmux plugins
  ansible.builtin.git:
    repo: "{{ item.value }}"
    dest: "{{ dotfiles_home }}/.tmux/plugins/{{ item.key }}"
    depth: 1
    update: false
  become: false
  loop: "{{ tmux_plugins | dict2items }}"

- name: Set login shell
  ansible.builtin.user:
    name: "{{ dotfiles_user }}"
    shell: "{{ base_login_shell }}"
