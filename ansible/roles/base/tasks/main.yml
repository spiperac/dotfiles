---
- name: Load distribution variables
  ansible.builtin.include_vars:
    file: "{{ distro }}.yaml"

- name: Configure Arch package manager
  when: distro == 'arch'
  block:
    - name: Enable multilib repository
      ansible.builtin.blockinfile:
        path: /etc/pacman.conf
        marker: "# {mark} ANSIBLE MANAGED: multilib"
        block: |
          [multilib]
          Include = /etc/pacman.d/mirrorlist

    - name: Set pacman options
      ansible.builtin.lineinfile:
        path: /etc/pacman.conf
        insertafter: '^\[options\]'
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
      loop:
        - { regexp: '^#?\s*ParallelDownloads', line: "ParallelDownloads = 5" }
        - { regexp: '^#?\s*Color\s*$', line: "Color" }
        - { regexp: '^#?\s*ILoveCandy\s*$', line: "ILoveCandy" }

- name: Configure Debian package sources
  when: distro == 'debian'
  block:
    - name: Install deb822 repository support
      ansible.builtin.apt:
        name: python3-debian
        state: present

    - name: Add Debian repositories
      ansible.builtin.deb822_repository:
        name: "{{ item.name }}"
        types: deb
        uris: "{{ item.uris }}"
        suites: "{{ item.suites }}"
        components: "{{ base_debian_components }}"
        signed_by: /usr/share/keyrings/debian-archive-keyring.pgp
      loop:
        - name: debian
          uris: https://deb.debian.org/debian
          suites:
            - "{{ ansible_facts['distribution_release'] }}"
            - "{{ ansible_facts['distribution_release'] }}-updates"
        - name: debian-security
          uris: https://deb.debian.org/debian-security
          suites:
            - "{{ ansible_facts['distribution_release'] }}-security"
      loop_control:
        label: "{{ item.name }}"
      register: base_debian_repos

    - name: Remove legacy sources.list
      ansible.builtin.file:
        path: /etc/apt/sources.list
        state: absent
      register: base_legacy_sources

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: "{{ 0 if (base_debian_repos is changed or base_legacy_sources is changed) else 3600 }}"

- name: Install base packages
  ansible.builtin.package:
    name: "{{ base_packages }}"
    state: present

- name: Install CPU microcode
  ansible.builtin.package:
    name: "{{ base_ucode[ansible_facts['processor_vendor_id']] }}"
    state: present
  when:
    - base_ucode is defined
    - ansible_facts['processor_vendor_id'] is defined
    - ansible_facts['processor_vendor_id'] in base_ucode

- name: Generate locales
  community.general.locale_gen:
    name: "{{ item }}"
    state: present
  loop: "{{ base_locales }}"
  when: distro != 'freebsd'

- name: Set system locale
  ansible.builtin.copy:
    dest: "{{ base_locale_file }}"
    content: "LANG={{ base_locales[0] }}\n"
    mode: "0644"
  when: distro != 'freebsd'

- name: Set timezone
  community.general.timezone:
    name: "{{ base_timezone }}"

- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

- name: Disable iwd
  ansible.builtin.systemd_service:
    name: iwd.service
    enabled: false
  when: "'iwd' in base_packages"

- name: Deploy rc.conf
  ansible.builtin.copy:
    src: rc.conf
    dest: /etc/rc.conf
    owner: root
    group: wheel
    mode: "0644"
  when: distro == 'freebsd'

- name: Deploy loader.conf
  ansible.builtin.copy:
    src: loader.conf
    dest: /boot/loader.conf
    owner: root
    group: wheel
    mode: "0644"
  when: distro == 'freebsd'

- name: Suspend on lid close
  ansible.posix.sysctl:
    name: hw.acpi.lid_switch_state
    value: S3
    sysctl_file: /etc/sysctl.conf
  when: distro == 'freebsd'

- name: Power down PCI devices without a driver
  ansible.posix.sysctl:
    name: hw.pci.do_power_nodriver
    value: "3"
    sysctl_file: /etc/sysctl.conf
  when: distro == 'freebsd'

- name: Set up smart card
  when: distro == 'freebsd'
  block:
    - name: Check RS-Key in CCID reader list
      community.general.xml:
        path: /usr/local/lib/pcsc/drivers/ifd-ccid.bundle/Contents/Info.plist
        xpath: /plist/dict/key[.='ifdFriendlyName']/following-sibling::array[1]/string[.='RS-Key']
        count: true
      register: ccid_rskey

    - name: Add RS-Key to CCID reader list
      community.general.xml:
        path: /usr/local/lib/pcsc/drivers/ifd-ccid.bundle/Contents/Info.plist
        xpath: "/plist/dict/key[.='{{ item.key }}']/following-sibling::array[1]"
        add_children:
          - string: "{{ item.value }}"
      loop:
        - { key: ifdVendorID, value: "0x1209" }
        - { key: ifdProductID, value: "0x0001" }
        - { key: ifdFriendlyName, value: RS-Key }
      when: ccid_rskey.count == 0
      notify: Restart pcscd

    - name: Start pcscd
      ansible.builtin.service:
        name: pcscd
        state: started

    - name: Ensure ~/.gnupg exists
      ansible.builtin.file:
        path: "{{ dotfiles_home }}/.gnupg"
        state: directory
        mode: "0700"
      become: false

    - name: Deploy scdaemon.conf
      ansible.builtin.copy:
        src: scdaemon.conf
        dest: "{{ dotfiles_home }}/.gnupg/scdaemon.conf"
        mode: "0600"
      become: false

- name: Enable base services
  ansible.builtin.service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: "{{ base_services }}"

- name: Configure snapper
  when:
    - ansible_facts['mounts'] | selectattr('mount', 'equalto', '/') | map(attribute='fstype') | first | default('') == 'btrfs'
    - ansible_facts['service_mgr'] == 'systemd'
  block:
    - name: Create snapper root config
      ansible.builtin.command:
        cmd: snapper --config root create-config /
        creates: /etc/snapper/configs/root

    - name: Enable snapper timers
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: true
        state: started
      loop:
        - snapper-timeline.timer
        - snapper-cleanup.timer

- name: Install flatpak
  ansible.builtin.package:
    name: "{{ flatpak_package }}"
    state: present
  when: distro != 'freebsd'

- name: Add Flathub remote
  community.general.flatpak_remote:
    name: flathub
    state: present
    method: system
    flatpakrepo_url: https://dl.flathub.org/repo/flathub.flatpakrepo
  when: distro != 'freebsd'

- name: Set up nix
  when: base_nix | bool
  block:
    - name: Install Nix daemon setup
      ansible.builtin.apt:
        name: nix-setup-systemd
        state: present
      become: true

    - name: Add user to nix group
      ansible.builtin.user:
        name: "{{ dotfiles_user }}"
        groups: "{{ base_nix_group }}"
        append: true
      when: base_nix_group is defined

    - name: Enable flakes
      ansible.builtin.lineinfile:
        path: "{{ dotfiles_home }}/.config/nix/nix.conf"
        line: "experimental-features = nix-command flakes"
        create: true
        mode: "0644"
      become: false

    - name: Add nix channel
      ansible.builtin.command:
        cmd: "nix-channel --add {{ nix_channel_url }} {{ nix_channel_name }}"
        creates: "{{ dotfiles_home }}/.nix-channels"
      become: false

    - name: Populate nix store
      ansible.builtin.command:
        cmd: nix-channel --update
        creates: /nix/store
      become: false

- name: Install tmux plugins
  ansible.builtin.git:
    repo: "{{ item.value }}"
    dest: "{{ dotfiles_home }}/.tmux/plugins/{{ item.key }}"
    depth: 1
    update: false
  become: false
  loop: "{{ tmux_plugins | dict2items }}"

- name: Set login shell
  ansible.builtin.user:
    name: "{{ dotfiles_user }}"
    shell: "{{ base_login_shell }}"

- name: Create Hack font directory
  ansible.builtin.file:
    path: "{{ dotfiles_home }}/.local/share/fonts/Hack"
    state: directory
    owner: "{{ dotfiles_user }}"
    group: "{{ dotfiles_gid }}"
    recurse: true

- name: Install Hack Nerd Font
  ansible.builtin.unarchive:
    src: https://github.com/ryanoasis/nerd-fonts/releases/latest/download/Hack.zip
    dest: "{{ dotfiles_home }}/.local/share/fonts/Hack"
    remote_src: true
    owner: "{{ dotfiles_user }}"
    group: "{{ dotfiles_gid }}"
    creates: "{{ dotfiles_home }}/.local/share/fonts/Hack/HackNerdFont-Regular.ttf"
  register: hack_font

- name: Rebuild font cache
  ansible.builtin.command: fc-cache -f
  become: false
  when: hack_font is changed
  changed_when: true
