- name: Install tmux plugins
  ansible.builtin.git:
    repo: "{{ item.value }}"
    dest: "{{ dotfiles_home }}/.tmux/plugins/{{ item.key }}"
    depth: 1
    update: false
  become: false
  loop: "{{ tmux_plugins | dict2items }}"

- name: Set login shell
  ansible.builtin.user:
    name: "{{ dotfiles_user }}"
    shell: "{{ base_login_shell }}"

- name: Set Fira Code as default monospace font
  ansible.builtin.copy:
    dest: /etc/fonts/local.conf
    content: |
      <?xml version="1.0"?>
      <!DOCTYPE fontconfig SYSTEM "fonts.dtd">
      <fontconfig>
        <alias>
          <family>monospace</family>
          <prefer><family>Fira Code</family></prefer>
        </alias>
      </fontconfig>
    mode: "0644"
  when: distro == 'gentoo'
