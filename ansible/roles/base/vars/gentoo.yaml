---
base_packages:
  # Privilege escalation
  - app-admin/doas

  # Hardware & firmware
  - sys-apps/fwupd
  - sys-auth/fprintd
  - sys-apps/smartmontools

  # Networking
  - net-misc/networkmanager

  # Firewall
  - net-firewall/ufw

  # Snapshots (btrfs)
  - sys-fs/btrfs-progs
  - app-backup/snapper

  # VCS
  - dev-vcs/git

  # Core tools
  - sys-apps/ripgrep
  - sys-apps/fd
  - app-shells/fzf
  - sys-apps/bat
  - sys-apps/eza
  - app-misc/jq
  - app-text/tree
  - sys-apps/file
  - sys-fs/duf
  - sys-process/htop
  - net-misc/rsync
  - app-admin/stow
  - gui-apps/wl-clipboard
  - net-analyzer/mtr
  - net-dns/doggo
  - net-misc/whois
  - sys-process/lsof
  - net-misc/socat
  - net-misc/wget
  - net-misc/curl

  # Archiving
  - app-arch/7zip
  - app-arch/unzip
  - app-arch/zip
  - app-arch/xz-utils

  # Crypto
  - dev-libs/openssl
  - net-misc/openssh
  - app-crypt/gnupg
  - app-crypt/pinentry
  - app-admin/pass

  # Shell & editors
  - app-shells/zsh
  - app-misc/tmux
  - app-editors/neovim
  - dev-util/tree-sitter-cli
  - app-editors/vim
  - app-editors/nano
  - sys-apps/less

  # Terminal emulators
  - gui-apps/foot

  # Fonts
  - media-fonts/fira-code
  - media-fonts/symbols-nerd-font

base_services:
  - NetworkManager.service
  - ufw.service

base_locale_file: /etc/locale.conf

base_login_shell: /bin/zsh

base_nix: false

flatpak_package: sys-apps/flatpak
