---
- name: Install GNOME packages
  ansible.builtin.package:
    name: "{{ desktop_gnome_packages }}"
    state: present

- name: Install GNOME flatpaks
  community.general.flatpak:
    name: "{{ desktop_gnome_flatpaks }}"
    state: present
    method: system
    remote: flathub
  when: desktop_gnome_flatpaks | length > 0

- name: Enable GNOME services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: "{{ desktop_gnome_services }}"
  when: ansible_facts['service_mgr'] == 'systemd'

- name: Load dconf settings
  ansible.builtin.shell:
    cmd: "dconf load / < {{ role_path }}/files/dconf.ini"
  become: false
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ dotfiles_uid }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ dotfiles_uid }}/bus"
  changed_when: true
  failed_when: false
