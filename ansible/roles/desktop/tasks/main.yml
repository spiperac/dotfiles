---
- name: Load distribution variables
  ansible.builtin.include_vars:
    file: "{{ distro }}.yaml"

- name: Check desktop sessions
  ansible.builtin.assert:
    that:
      - desktop_sessions | difference(desktop_supported_sessions) | length == 0
    fail_msg: >-
      {{ desktop_sessions | difference(desktop_supported_sessions) | join(', ') }}
      is not supported on {{ distro }} (supported: {{ desktop_supported_sessions | join(', ') }}).

- name: Install desktop packages
  ansible.builtin.package:
    name: "{{ desktop_packages }}"
    state: present
  when: desktop_packages | length > 0

- name: Enable desktop services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: "{{ desktop_services }}"
  when: ansible_facts['service_mgr'] == 'systemd'

- name: Clone pixora-icons
  ansible.builtin.git:
    repo: https://github.com/tsora1603/pixora-icons.git
    dest: /usr/local/share/pixora-icons
    depth: 1

- name: Create local icon theme directory
  ansible.builtin.file:
    path: /usr/local/share/icons
    state: directory
    mode: "0755"

- name: Link pixora icon themes
  ansible.builtin.file:
    src: "/usr/local/share/pixora-icons/{{ item }}"
    dest: "/usr/local/share/icons/{{ item }}"
    state: link
  loop:
    - pixora
    - pixora-dark

- name: Set up sway
  ansible.builtin.import_tasks: sway.yml
  when: "'sway' in desktop_sessions"
  tags: [sway]

- name: Set up GNOME
  ansible.builtin.import_tasks: gnome.yml
  when: "'gnome' in desktop_sessions"
  tags: [gnome]

- name: Find batteries without charge limit enabled
  ansible.builtin.shell:
    cmd: |
      for dev in $(upower -e | grep battery_); do
        state=$(busctl get-property org.freedesktop.UPower "$dev" \
          org.freedesktop.UPower.Device ChargeThresholdSupported ChargeThresholdEnabled | tr '\n' ' ')
        [ "$state" = "b true b false " ] && echo "$dev"
      done
      true
  register: charge_limit_batteries
  changed_when: false
  when: ansible_facts['service_mgr'] == 'systemd'

- name: Enable battery charge limit
  ansible.builtin.command:
    cmd: >-
      busctl call org.freedesktop.UPower {{ item }}
      org.freedesktop.UPower.Device EnableChargeThreshold b true
  loop: "{{ charge_limit_batteries.stdout_lines | default([]) }}"
  when: ansible_facts['service_mgr'] == 'systemd'
