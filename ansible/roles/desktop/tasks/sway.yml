---
- name: Install sway packages
  ansible.builtin.package:
    name: "{{ desktop_sway_packages }}"
    state: present

- name: Set up greetd
  when: "'gnome' not in desktop_sessions"
  block:
    - name: Deploy greetd config
      ansible.builtin.template:
        src: greetd.toml.j2
        dest: /etc/greetd/config.toml
        owner: root
        group: root
        mode: "0644"

    - name: Enable greetd
      ansible.builtin.systemd_service:
        name: greetd.service
        enabled: true

- name: Enable sway services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
  loop: "{{ desktop_sway_services | default([]) }}"

- name: Enable sway user units
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    scope: global
  loop: "{{ desktop_sway_user_units | default([]) }}"

- name: Enable SSH support in gpg-agent
  ansible.builtin.lineinfile:
    path: "{{ dotfiles_home }}/.gnupg/gpg-agent.conf"
    line: enable-ssh-support
    create: true
    mode: "0600"
  become: false

- name: Create screenshots directory
  ansible.builtin.file:
    path: "{{ dotfiles_home }}/Pictures/Screenshots"
    state: directory
    mode: "0755"
  become: false

- name: Prefer dark color scheme
  ansible.builtin.command: gsettings set org.gnome.desktop.interface color-scheme prefer-dark
  become: false

- name: Dark GTK theme
  ansible.builtin.command: gsettings set org.gnome.desktop.interface gtk-theme Adwaita-dark
  become: false
