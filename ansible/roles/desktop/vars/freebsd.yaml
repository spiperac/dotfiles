---
desktop_supported_sessions:
  - sway

desktop_packages: []

desktop_services: []

desktop_sway_packages:
  # Graphics
  - drm-kmod
  - libva-intel-media-driver

  # Core
  - sway
  - swaybg
  - swaylock
  - swayidle
  - waybar
  - mako
  - fuzzel
  - grim
  - slurp
  - wmenu
  - xwayland
  - wl-clipboard
  - cliphist
  - playerctl

  # Display manager
  - ly
  - seatd

  # File manager & icons
  - nautilus
  - papirus-icon-theme
  - gvfs

  # Applets
  - wpa_supplicant_gui
  - libnotify

  # Session
  - dbus
  - mate-polkit
  - gnome-keyring

  # Portals
  - xdg-desktop-portal-wlr
  - xdg-desktop-portal-gtk

  # Power
  - upower

  # Audio
  - sndio

desktop_user_groups:
  - video     # seatd, DRM
  - audio     # /dev/dsp, /dev/mixer
  - operator  # /dev/acpi, suspend
  - u2f       # security key

desktop_sway_services:
  - dbus
  - seatd
