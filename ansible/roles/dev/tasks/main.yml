---
- name: Load distribution variables
  ansible.builtin.include_vars:
    file: "{{ 'arch.yaml' if ansible_facts['os_family'] == 'Archlinux' or ansible_facts['distribution'] == 'Archlinux' else 'fedora.yaml' }}"

- name: Install development packages
  ansible.builtin.package:
    name: "{{ dev_packages }}"
    state: present

- name: Install development tools with Go
  ansible.builtin.command:
    cmd: "go install {{ item }}"
  become: false
  environment:
    GOBIN: "{{ dotfiles_home }}/.local/bin"
    PATH: "{{ dotfiles_home }}/.local/bin:{{ ansible_facts['env']['PATH'] }}"
  loop: "{{ dev_go }}"
  when: dev_go is defined and dev_go | length > 0
  changed_when: false

- name: Install development tools with pipx
  community.general.pipx:
    name: "{{ item }}"
    state: install
  become: false
  environment:
    PIPX_HOME: "{{ dotfiles_home }}/.local/pipx"
    PIPX_BIN_DIR: "{{ dotfiles_home }}/.local/bin"
  loop: "{{ dev_pipx }}"

- name: Install development tools with npm
  community.general.npm:
    name: "{{ item }}"
    global: true
    state: latest
  become: false
  environment:
    NPM_CONFIG_PREFIX: "{{ dotfiles_home }}/.local"
  loop: "{{ dev_npm }}"
  when: dev_npm is defined and dev_npm | length > 0

- name: Install virtualization packages
  ansible.builtin.package:
    name: "{{ dev_virt_packages }}"
    state: present

- name: Enable libvirtd
  ansible.builtin.systemd_service:
    name: libvirtd.service
    enabled: true
    state: started
  when: ansible_facts['service_mgr'] == 'systemd'

- name: Add user to libvirt group
  ansible.builtin.user:
    name: "{{ dotfiles_user }}"
    groups: libvirt
    append: true

- name: Install Docker packages
  ansible.builtin.package:
    name: "{{ dev_docker_packages }}"
    state: present

- name: Enable Docker
  ansible.builtin.systemd_service:
    name: docker.service
    enabled: true
    state: started
  when: ansible_facts['service_mgr'] == 'systemd'

- name: Add user to docker group
  ansible.builtin.user:
    name: "{{ dotfiles_user }}"
    groups: docker
    append: true
