---
- name: Install devops packages
  ansible.builtin.dnf5:
    name: "{{ devops_packages }}"
    state: present

- name: Install devops tools with pipx
  community.general.pipx:
    name: "{{ item }}"
    state: install
  become: false
  environment:
    PIPX_HOME: "{{ dotfiles_home }}/.local/pipx"
    PIPX_BIN_DIR: "{{ dotfiles_home }}/.local/bin"
  loop: "{{ devops_pipx }}"

- name: Enable the rootless podman socket
  ansible.builtin.systemd_service:
    name: podman.socket
    scope: user
    enabled: true
    state: started
  become: false
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ dotfiles_uid }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ dotfiles_uid }}/bus"
