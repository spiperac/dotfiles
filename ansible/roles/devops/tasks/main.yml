---
- name: Load distribution variables
  ansible.builtin.include_vars:
    file: "{{ 'arch.yaml' if ansible_facts['os_family'] == 'Archlinux' or ansible_facts['distribution'] == 'Archlinux' else 'fedora.yaml' }}"

- name: Install devops packages
  ansible.builtin.package:
    name: "{{ devops_packages }}"
    state: present

- name: Install devops tools with pipx
  community.general.pipx:
    name: "{{ item }}"
    state: install
  become: false
  environment:
    PIPX_HOME: "{{ dotfiles_home }}/.local/pipx"
    PIPX_BIN_DIR: "{{ dotfiles_home }}/.local/bin"
  loop: "{{ devops_pipx }}"

- name: Enable podman user socket
  ansible.builtin.systemd_service:
    name: podman.socket
    scope: user
    enabled: true
    state: started
  become: false
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ dotfiles_uid }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ dotfiles_uid }}/bus"
  when: ansible_facts['service_mgr'] == 'systemd'
