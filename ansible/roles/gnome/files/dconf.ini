[org/gnome/desktop/interface]
accent-color='orange'
color-scheme='prefer-dark'
monospace-font-name='Fira Code 11'
toolkit-accessibility=false

[org/gnome/desktop/input-sources]
sources=[('xkb', 'us')]
xkb-options=['ctrl:nocaps']

[org/gnome/desktop/wm/keybindings]
close=['<Shift><Super>q', '<Alt>F4']

[org/gnome/desktop/wm/preferences]
button-layout='appmenu:minimize,maximize,close'

[org/gnome/mutter]
experimental-features=['scale-monitor-framebuffer']

[org/gnome/shell]
disable-user-extensions=false
enabled-extensions=['appindicatorsupport@rgcjonas.gmail.com']
favorite-apps=['com.mitchellh.ghostty.desktop', 'firefox.desktop', 'com.fastmail.Fastmail.desktop', 'emacs.desktop', 'md.obsidian.Obsidian.desktop', 'org.squidowl.halloy.desktop', 'org.gnome.Nautilus.desktop', 'de.haeckerfelix.Shortwave.desktop']

[org/gnome/shell/keybindings]
show-screenshot-ui=['<Shift><Super>p']

[org/gnome/nautilus/preferences]
default-folder-viewer='icon-view'

[org/gnome/settings-daemon/plugins/media-keys]
custom-keybindings=['/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom0/']

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom0]
binding='<Super>Return'
command='ghostty'
name='Terminal'
