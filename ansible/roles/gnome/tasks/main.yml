---
- name: Load distribution variables
  ansible.builtin.include_vars:
    file: "{{ 'arch.yaml' if ansible_facts['os_family'] == 'Archlinux' or ansible_facts['distribution'] == 'Archlinux' else 'fedora.yaml' }}"

- name: Install GNOME packages
  ansible.builtin.package:
    name: "{{ gnome_packages }}"
    state: present

- name: Load dconf settings
  ansible.builtin.shell:
    cmd: "dconf load / < {{ role_path }}/files/dconf.ini"
  become: false
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ dotfiles_uid }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ dotfiles_uid }}/bus"
  changed_when: true
  failed_when: false
