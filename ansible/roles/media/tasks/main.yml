---
- name: Load distribution variables
  ansible.builtin.include_vars:
    file: "{{ distro }}.yaml"

- name: Install media packages
  ansible.builtin.package:
    name: "{{ media_packages }}"
    state: present

- name: Install media flatpaks
  community.general.flatpak:
    name: "{{ media_flatpaks }}"
    state: present
    method: system
    remote: flathub
