---
- name: Load distribution variables
  ansible.builtin.include_vars:
    file: "{{ 'arch.yaml' if ansible_facts['os_family'] == 'Archlinux' or ansible_facts['distribution'] == 'Archlinux' else ('gentoo.yaml' if ansible_facts['distribution'] == 'Gentoo' else 'fedora.yaml') }}"

- name: Install security packages
  ansible.builtin.package:
    name: "{{ security_packages }}"
    state: present

- name: Add user to wireshark group
  ansible.builtin.user:
    name: "{{ dotfiles_user }}"
    groups: wireshark
    append: true
  when: ansible_facts['distribution'] != 'Gentoo'

- name: Install security flatpaks
  community.general.flatpak:
    name: "{{ security_flatpaks }}"
    state: present
    method: system
    remote: flathub

- name: Install security tools with Go
  ansible.builtin.command:
    cmd: "go install {{ item }}"
  become: false
  environment:
    GOBIN: "{{ dotfiles_home }}/.local/bin"
    PATH: "{{ dotfiles_home }}/.local/bin:{{ ansible_facts['env']['PATH'] }}"
  loop: "{{ security_go }}"
  when: security_go is defined and security_go | length > 0
  changed_when: false

- name: Clone SecLists
  ansible.builtin.git:
    repo: https://github.com/danielmiessler/SecLists.git
    dest: "{{ seclists_dir }}"
    depth: 1
    version: master
    update: false
  when: ansible_facts['distribution'] != 'Gentoo'

- name: Create ligolo-ng directory
  ansible.builtin.file:
    path: /opt/ligolo-ng
    state: directory
    mode: "0755"
  when: ansible_facts['distribution'] != 'Gentoo'

- name: Download ligolo-ng
  ansible.builtin.unarchive:
    src: "https://github.com/nicocha30/ligolo-ng/releases/download/v{{ ligolo_version }}/ligolo-ng_{{ item }}_{{ ligolo_version }}_linux_amd64.tar.gz"
    dest: /opt/ligolo-ng
    remote_src: true
    mode: "0755"
    creates: "/opt/ligolo-ng/{{ item }}"
  loop:
    - proxy
    - agent
  when: ansible_facts['distribution'] != 'Gentoo'

- name: Link ligolo-ng
  ansible.builtin.file:
    src: "/opt/ligolo-ng/{{ item }}"
    dest: "/usr/local/bin/ligolo-{{ item }}"
    state: link
  loop:
    - proxy
    - agent
  when: ansible_facts['distribution'] != 'Gentoo'
