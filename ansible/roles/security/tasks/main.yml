---
- name: Load distribution variables
  ansible.builtin.include_vars:
    file: "{{ distro }}.yaml"

- name: Install security packages
  ansible.builtin.package:
    name: "{{ security_packages }}"
    state: present


- name: Install security flatpaks
  community.general.flatpak:
    name: "{{ security_flatpaks }}"
    state: present
    method: system
    remote: flathub

- name: Install security tools with Go
  ansible.builtin.command:
    cmd: "go install {{ item }}"
  become: false
  environment:
    GOBIN: "{{ dotfiles_home }}/.local/bin"
    PATH: "{{ dotfiles_home }}/.local/bin:{{ ansible_facts['env']['PATH'] }}"
  loop: "{{ security_go }}"
  changed_when: false

- name: Link Go tools under clear names
  ansible.builtin.file:
    src: "{{ dotfiles_home }}/.local/bin/{{ item.value }}"
    dest: "{{ dotfiles_home }}/.local/bin/{{ item.key }}"
    state: link
  become: false
  loop: "{{ security_go_links | dict2items }}"

- name: Install security tools with pipx
  community.general.pipx:
    name: "{{ item.name }}"
    source: "{{ item.source | default(omit) }}"
    state: latest
  become: false
  loop: "{{ security_pipx }}"
  loop_control:
    label: "{{ item.name }}"

- name: Clone SecLists
  ansible.builtin.git:
    repo: https://github.com/danielmiessler/SecLists.git
    dest: "{{ seclists_dir }}"
    depth: 1
    version: master
    update: false
  when: distro != 'gentoo'
