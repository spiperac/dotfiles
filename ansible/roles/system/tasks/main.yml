---
- name: Load distribution variables
  ansible.builtin.include_vars:
    file: "{{ 'arch.yaml' if ansible_facts['os_family'] == 'Archlinux' or ansible_facts['distribution'] == 'Archlinux' else ('gentoo.yaml' if ansible_facts['distribution'] == 'Gentoo' else 'fedora.yaml') }}"

- name: Install system packages
  ansible.builtin.package:
    name: "{{ system_packages }}"
    state: present
  when: system_packages | length > 0

- name: Install CPU microcode
  ansible.builtin.package:
    name: "{{ system_ucode[ansible_facts['processor_vendor_id']] }}"
    state: present
  when:
    - system_ucode is defined
    - ansible_facts['processor_vendor_id'] is defined
    - ansible_facts['processor_vendor_id'] in system_ucode

- name: Generate locales
  community.general.locale_gen:
    name: "{{ item }}"
    state: present
  loop: "{{ system_locales }}"

- name: Set system locale
  ansible.builtin.copy:
    dest: /etc/locale.conf
    content: "LANG={{ system_locales[0] }}\n"
    mode: "0644"

- name: Set timezone
  community.general.timezone:
    name: "{{ system_timezone }}"

- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ system_hostname }}"

- name: Disable iwd
  ansible.builtin.systemd_service:
    name: iwd.service
    enabled: false
  when: "'iwd' in system_packages"

- name: Enable firewall
  ansible.builtin.systemd_service:
    name: ufw.service
    enabled: true
    state: started
  when: ansible_facts['service_mgr'] == 'systemd'

- name: Configure snapper
  when:
    - ansible_facts['mounts'] | selectattr('mount', 'equalto', '/') | map(attribute='fstype') | first | default('') == 'btrfs'
    - ansible_facts['service_mgr'] == 'systemd'
  block:
    - name: Create snapper root config
      ansible.builtin.command:
        cmd: snapper --config root create-config /
        creates: /etc/snapper/configs/root

    - name: Enable snapper timers
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: true
        state: started
      loop:
        - snapper-timeline.timer
        - snapper-cleanup.timer

- name: Configure Fedora repositories
  when: ansible_facts['distribution'] == "Fedora"
  block:
    - name: Install RPM Fusion (free + nonfree)
      ansible.builtin.dnf5:
        name:
          - "https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-{{ ansible_facts['distribution_major_version'] }}.noarch.rpm"
          - "https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-{{ ansible_facts['distribution_major_version'] }}.noarch.rpm"
        state: present
        disable_gpg_check: true

    - name: Install terra-release
      ansible.builtin.command:
        cmd: >-
          dnf -y install --nogpgcheck
          --repofrompath 'terra,https://repos.fyralabs.com/terra$releasever'
          terra-release
        creates: /etc/yum.repos.d/terra.repo

    - name: Pin Terra packages
      community.general.ini_file:
        path: /etc/yum.repos.d/terra.repo
        section: terra
        option: includepkgs
        value: "{{ terra_includepkgs }}"
        mode: "0644"
        no_extra_spaces: true

    - name: Disable Terra sub-repositories
      ansible.builtin.command:
        cmd: "dnf config-manager setopt {{ item }}.enabled=0"
      loop:
        - terra-extras
        - terra-mesa
        - terra-nvidia
      changed_when: false
      failed_when: false

    - name: Add Docker repository
      ansible.builtin.yum_repository:
        name: docker-ce-stable
        description: "Docker CE Stable - $basearch"
        baseurl: "https://download.docker.com/linux/fedora/$releasever/$basearch/stable"
        gpgcheck: true
        gpgkey: https://download.docker.com/linux/fedora/gpg
        enabled: true

    - name: Add Kubernetes repository
      ansible.builtin.yum_repository:
        name: kubernetes
        description: "Kubernetes {{ kubernetes_release }}"
        baseurl: "https://pkgs.k8s.io/core:/stable:/{{ kubernetes_release }}/rpm/"
        gpgcheck: true
        gpgkey: "https://pkgs.k8s.io/core:/stable:/{{ kubernetes_release }}/rpm/repodata/repomd.xml.key"
        includepkgs: kubectl
        enabled: true

- name: Configure Arch package manager
  when: ansible_facts['distribution'] == "Archlinux"
  block:
    - name: Enable multilib repository
      ansible.builtin.blockinfile:
        path: /etc/pacman.conf
        marker: "# {mark} ANSIBLE MANAGED: multilib"
        block: |
          [multilib]
          Include = /etc/pacman.d/mirrorlist

    - name: Set pacman options
      ansible.builtin.lineinfile:
        path: /etc/pacman.conf
        insertafter: '^\[options\]'
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
      loop:
        - { regexp: '^#?\s*ParallelDownloads', line: "ParallelDownloads = 5" }
        - { regexp: '^#?\s*Color\s*$', line: "Color" }
        - { regexp: '^#?\s*ILoveCandy\s*$', line: "ILoveCandy" }

- name: Configure Gentoo package manager
  when: ansible_facts['distribution'] == 'Gentoo'
  block:
    - name: Create portage package.use directory
      ansible.builtin.file:
        path: /etc/portage/package.use
        state: directory
        mode: "0755"

    - name: Sync portage package.use files
      ansible.builtin.copy:
        src: files/package.use/
        dest: /etc/portage/package.use/
        owner: root
        group: root
        mode: "0644"

    - name: Create portage package.accept_keywords directory
      ansible.builtin.file:
        path: /etc/portage/package.accept_keywords
        state: directory
        mode: "0755"

    - name: Sync portage package.accept_keywords files
      ansible.builtin.copy:
        src: files/package.accept_keywords/
        dest: /etc/portage/package.accept_keywords/
        owner: root
        group: root
        mode: "0644"

    - name: Deploy portage make.conf if provided
      ansible.builtin.copy:
        src: files/make.conf
        dest: /etc/portage/make.conf
        owner: root
        group: root
        mode: "0644"
      when: lookup('ansible.builtin.first_found', [role_path ~ '/files/make.conf'], errors='ignore', skip=true) != ''

- name: Install flatpak
  ansible.builtin.package:
    name: "{{ flatpak_package }}"
    state: present

- name: Add Flathub remote
  community.general.flatpak_remote:
    name: flathub
    state: present
    method: system
    flatpakrepo_url: https://dl.flathub.org/repo/flathub.flatpakrepo
