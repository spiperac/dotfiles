---
system_packages:
  # Boot
  - linux
  - linux-firmware
  - mkinitcpio
  - efibootmgr
  - sudo
  - base
  - base-devel
  - iwd
  - sof-firmware
  - intel-ucode
  - intel-media-driver
  - libva-intel-driver
  - vulkan-intel
  - vulkan-nouveau
  - vulkan-radeon
  - xf86-video-amdgpu
  - xf86-video-ati
  - xf86-video-nouveau
  - zram-generator

  # Firewall
  - ufw

  # Snapshots
  - btrfs-progs
  - snapper
  - smartmontools

  # Fingerprint
  - fprintd
  - fwupd

system_ucode:
  GenuineIntel: intel-ucode
  AuthenticAMD: amd-ucode

# Repositories
kubernetes_release: "v1.36"
