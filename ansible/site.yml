---
- name: Provision workstation
  hosts: localhost
  become: true
  gather_facts: true

  pre_tasks:
    - name: Check distribution
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] in ['Fedora', 'Archlinux']
        fail_msg: "This playbook targets Fedora or Arch Linux (found {{ ansible_facts['distribution'] }})."
      tags: always

    - name: Resolve user
      ansible.builtin.set_fact:
        dotfiles_user: "{{ lookup('env', 'SUDO_USER') or lookup('env', 'USER') or ansible_facts['user_id'] }}"
      tags: always

    - name: Read passwd entry
      ansible.builtin.getent:
        database: passwd
        key: "{{ dotfiles_user }}"
      tags: always

    - name: Set home, uid and gid
      ansible.builtin.set_fact:
        dotfiles_home: "{{ ansible_facts['getent_passwd'][dotfiles_user][4] }}"
        dotfiles_uid: "{{ ansible_facts['getent_passwd'][dotfiles_user][1] }}"
        dotfiles_gid: "{{ ansible_facts['getent_passwd'][dotfiles_user][2] }}"
      tags: always

  roles:
    - { role: system, tags: [system] }
    - { role: base, tags: [base] }
    - { role: desktop, tags: [desktop] }
    - { role: gnome, tags: [gnome] }
    - { role: sway, tags: [sway] }
    - { role: apps, tags: [apps] }
    - { role: media, tags: [media] }
    - { role: dev, tags: [dev] }
    - { role: security, tags: [security] }

  post_tasks:
    - name: Ensure ~/.config exists
      ansible.builtin.file:
        path: "{{ dotfiles_home }}/.config"
        state: directory
        mode: "0755"
      become: false
      tags: [dotfiles]

    - name: Ensure ~/.ssh dirs exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0700"
      loop:
        - "{{ dotfiles_home }}/.ssh"
        - "{{ dotfiles_home }}/.ssh/config.d"
      become: false
      tags: [iam]

    - name: Write general SSH config
      ansible.builtin.copy:
        content: |
          Include ~/.ssh/config.d/*

          Host *
              AddKeysToAgent yes
              ServerAliveInterval 60
        dest: "{{ dotfiles_home }}/.ssh/config"
        mode: "0600"
      become: false
      tags: [iam]

    - name: Link scripts
      ansible.builtin.file:
        src: "{{ dotfiles_repo }}/scripts"
        dest: "{{ dotfiles_home }}/scripts"
        state: link
      become: false
      tags: [dotfiles]

    - name: Stow config
      ansible.builtin.command:
        cmd: >-
          stow --verbose --restow
          --target={{ dotfiles_home }}
          --ignore={{ dotfiles_stow_ignore_re | quote }}
          config
        chdir: "{{ dotfiles_repo }}"
      become: false
      register: stow_run
      changed_when: "'LINK:' in stow_run.stderr or 'UNLINK:' in stow_run.stderr"
      tags: [dotfiles]

    # Last on purpose: these need the security key to decrypt from pass
    - name: Write private SSH hosts from pass
      ansible.builtin.copy:
        content: "{{ lookup('community.general.passwordstore', 'ssh/hosts', returnall=true) }}\n"
        dest: "{{ dotfiles_home }}/.ssh/config.d/hosts"
        mode: "0600"
      become: false
      tags: [iam]

    - name: Write NAS credentials from pass
      ansible.builtin.copy:
        content: |
          username={{ lookup('community.general.passwordstore', 'nas/username') }}
          password={{ lookup('community.general.passwordstore', 'nas/password') }}
        dest: /etc/nas-credentials
        owner: root
        group: root
        mode: "0600"
      tags: [iam]

    - name: Write NAS mount units
      ansible.builtin.copy:
        content: |
          [Unit]
          Description=NAS {{ item.share }}
          After=network-online.target tailscaled.service
          Wants=network-online.target

          [Mount]
          What=//{{ lookup('community.general.passwordstore', 'nas/host') }}/{{ item.share }}
          Where={{ item.path }}
          Type=cifs
          Options=credentials=/etc/nas-credentials,vers=3.1.1,uid={{ dotfiles_uid }},gid={{ dotfiles_gid }},_netdev
          TimeoutSec=10s
        dest: "/etc/systemd/system/{{ item.path | regex_replace('^/', '') | replace('/', '-') }}.mount"
        mode: "0644"
      loop: "{{ nas_shares }}"
      tags: [iam]

    - name: Write NAS automount units
      ansible.builtin.copy:
        content: |
          [Unit]
          Description=Automount NAS {{ item.share }}

          [Automount]
          Where={{ item.path }}
          TimeoutIdleSec=5min

          [Install]
          WantedBy=remote-fs.target
        dest: "/etc/systemd/system/{{ item.path | regex_replace('^/', '') | replace('/', '-') }}.automount"
        mode: "0644"
      loop: "{{ nas_shares }}"
      tags: [iam]

    - name: Enable NAS automounts
      ansible.builtin.systemd_service:
        name: "{{ item.path | regex_replace('^/', '') | replace('/', '-') }}.automount"
        enabled: true
        state: started
        daemon_reload: true
      loop: "{{ nas_shares }}"
      tags: [iam]
