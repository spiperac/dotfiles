[main]
horizontal-pad=8 
vertical-pad=3
use-bold=yes
width=50
font=Fira Code:size=16
icon-theme=Papirus

[border]
width=2
radius=6

[colors]
background="1e1e1ed9"
text="eeeeeeff"
selection="2b2b2bff"
selection-text="eeeeeeff"
match="393939ff"
border="3a3a3aff"

[key-bindings]
delete-line-forward=none
delete-line-backward=none
delete-next=none
prev=Control+k
next=Control+j
prev-page=Control+u
next-page=Control+d
